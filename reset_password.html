<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password - Campus Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #22181a;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #a6192e;
    --accent-hover: #841321;
    --accent-bg: #fbe9ea;
    --unavailable: #dc2626;
    --font-heading: 'Lora', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    color: var(--ink);
    background: #faf7f7;
    padding: 20px;
  }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-top: 4px solid var(--accent);
    border-radius: 12px;
    padding: 28px;
    width: 340px;
    max-width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  }
  h1 { font-family: var(--font-heading); font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: var(--unavailable); font-size: 13px; margin-top: 10px; display: none; }
  .footer-link { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; }
  .footer-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>Reset password</h1>
  <p class="sub">Choose a new password for your account.</p>
  <form id="resetForm">
    <label>New password</label>
    <input type="password" id="password" required autocomplete="new-password">
    <div class="hint">At least 8 characters.</div>
    <label>Confirm new password</label>
    <input type="password" id="confirmPassword" required autocomplete="new-password">
    <div class="error" id="error"></div>
    <button type="submit" id="submitBtn">Reset password</button>
  </form>
  <div class="footer-link"><a href="/login">Back to log in</a></div>
</div>
<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('error').textContent = 'This link is missing its reset token -- use the link from the email exactly as sent.';
  document.getElementById('error').style.display = 'block';
  document.getElementById('submitBtn').disabled = true;
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const errorEl = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');

  if (password !== confirmPassword) {
    errorEl.textContent = 'Passwords do not match.';
    errorEl.style.display = 'block';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Resetting...';
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      errorEl.textContent = body.error || ('Server error ' + res.status);
      errorEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset password';
      return;
    }
    window.location.href = '/login';
  } catch (err) {
    errorEl.textContent = 'Could not reach the server. Make sure server.py is running.';
    errorEl.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Reset password';
  }
});
</script>
</body>
</html>
