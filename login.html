<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - Campus Map</title>
<style>
  :root {
    --ink: #1a1a2e;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #2563eb;
    --unavailable: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #f8fafc;
    padding: 20px;
  }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 340px;
    max-width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
  }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: var(--unavailable); font-size: 13px; margin-top: 10px; display: none; }
  .footer-link { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; }
  .footer-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>Log in</h1>
  <p class="sub">Campus room booking</p>
  <form id="loginForm">
    <label>Email</label>
    <input type="email" id="email" required autocomplete="username">
    <label>Password</label>
    <input type="password" id="password" required autocomplete="current-password">
    <div class="error" id="error"></div>
    <button type="submit" id="submitBtn">Log in</button>
  </form>
  <div class="footer-link">No account? <a href="/signup">Sign up</a></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');

  submitBtn.disabled = true;
  submitBtn.textContent = 'Logging in...';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      errorEl.textContent = body.error || ('Server error ' + res.status);
      errorEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
      return;
    }
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = 'Could not reach the server. Make sure server.py is running.';
    errorEl.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
