<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings Overview - Campus Map</title>
<style>
  :root {
    --ink: #1a1a2e;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --available: #16a34a;
    --yours: #d97706;
    --unavailable: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #f8fafc;
    padding: 24px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  header a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }

  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
  .stat-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    min-width: 140px;
    flex: 1;
  }
  .stat-card .num { font-size: 24px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .top-rooms {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 20px;
  }
  .top-rooms h2 { font-size: 14px; margin: 0 0 10px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .bar-row .room-name { width: 220px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; background: #f1f5f9; border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; }
  .bar-count { width: 24px; text-align: right; color: var(--muted); flex-shrink: 0; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .controls input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  .controls label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  table { width: 100%; border-collapse: collapse; background: white; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
  th { background: #f1f5f9; color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.upcoming { background: #ecfdf5; color: var(--available); }
  .badge.past { background: #f1f5f9; color: var(--muted); }
  .cancel-btn {
    background: var(--unavailable);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .cancel-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty-state { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }
  .scroll-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/">&larr; Back to map</a>
    <h1>Bookings Overview</h1>
    <p class="sub">Every booking in the system, across all rooms and dates.</p>
  </header>

  <div class="stats" id="statCards"></div>
  <div class="top-rooms">
    <h2>Most-booked rooms</h2>
    <div id="topRooms"></div>
  </div>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search by room, name, or email...">
    <label><input type="checkbox" id="upcomingOnly"> Upcoming only</label>
  </div>

  <div class="scroll-wrap">
    <table>
      <thead>
        <tr>
          <th>Room</th>
          <th>Date</th>
          <th>Time</th>
          <th>Booked by</th>
          <th>Email</th>
          <th>Meeting</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
let ALL_BOOKINGS = [];

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function isUpcoming(b) {
  return b.date >= todayStr();
}

async function loadBookings() {
  const res = await fetch('/api/bookings/all');
  if (!res.ok) throw new Error('server returned ' + res.status);
  ALL_BOOKINGS = await res.json();
}

function renderStats() {
  const total = ALL_BOOKINGS.length;
  const upcoming = ALL_BOOKINGS.filter(isUpcoming).length;
  const past = total - upcoming;
  const uniqueRooms = new Set(ALL_BOOKINGS.map(b => b.room)).size;

  const cards = [
    { num: total, label: 'Total bookings' },
    { num: upcoming, label: 'Upcoming' },
    { num: past, label: 'Past' },
    { num: uniqueRooms, label: 'Rooms booked at least once' },
  ];
  document.getElementById('statCards').innerHTML = cards.map(c =>
    `<div class="stat-card"><div class="num">${c.num}</div><div class="label">${c.label}</div></div>`
  ).join('');
}

function renderTopRooms() {
  const counts = {};
  for (const b of ALL_BOOKINGS) counts[b.room] = (counts[b.room] || 0) + 1;
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const el = document.getElementById('topRooms');
  if (sorted.length === 0) {
    el.innerHTML = '<div class="empty-state">No bookings yet.</div>';
    return;
  }
  const max = sorted[0][1];
  el.innerHTML = sorted.map(([room, count]) => `
    <div class="bar-row">
      <span class="room-name">${escapeHtml(room)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(count / max * 100).toFixed(0)}%"></div></div>
      <span class="bar-count">${count}</span>
    </div>
  `).join('');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderTable() {
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const upcomingOnly = document.getElementById('upcomingOnly').checked;

  let rows = ALL_BOOKINGS.slice();
  if (upcomingOnly) rows = rows.filter(isUpcoming);
  if (search) {
    rows = rows.filter(b =>
      b.room.toLowerCase().includes(search) ||
      b.name.toLowerCase().includes(search) ||
      b.email.toLowerCase().includes(search)
    );
  }

  const tbody = document.getElementById('tableBody');
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state">No bookings match.</div></td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(b => {
    const upcoming = isUpcoming(b);
    const timeLabel = b.slotCount > 1 ? `${b.startTime}-${b.endTime} (${b.slotCount} slots)` : `${b.startTime}-${b.endTime}`;
    return `
      <tr data-group-id="${escapeHtml(b.group_id)}">
        <td>${escapeHtml(b.room)}</td>
        <td>${escapeHtml(b.date)}</td>
        <td>${escapeHtml(timeLabel)}</td>
        <td>${escapeHtml(b.name)}</td>
        <td>${escapeHtml(b.email)}</td>
        <td>${escapeHtml(b.meeting)}</td>
        <td><span class="badge ${upcoming ? 'upcoming' : 'past'}">${upcoming ? 'Upcoming' : 'Past'}</span></td>
        <td><button class="cancel-btn" data-group-id="${escapeHtml(b.group_id)}">Cancel</button></td>
      </tr>
    `;
  }).join('');

  tbody.querySelectorAll('.cancel-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Cancelling...';
      await fetch('/api/bookings/' + encodeURIComponent(btn.dataset.groupId), { method: 'DELETE' });
      await refreshAll();
    });
  });
}

async function refreshAll() {
  await loadBookings();
  renderStats();
  renderTopRooms();
  renderTable();
}

document.getElementById('searchBox').addEventListener('input', renderTable);
document.getElementById('upcomingOnly').addEventListener('change', renderTable);

refreshAll().catch(() => {
  document.getElementById('tableBody').innerHTML =
    '<tr><td colspan="8"><div class="empty-state">Could not reach the booking server. Make sure server.py is running and you opened this page via http://localhost:5000/overview.</div></td></tr>';
});
</script>
</body>
</html>
