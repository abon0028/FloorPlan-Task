<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password - Campus Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #22181a;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #a6192e;
    --accent-hover: #841321;
    --accent-bg: #fbe9ea;
    --available: #16a34a;
    --unavailable: #dc2626;
    --font-heading: 'Lora', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    color: var(--ink);
    background: #faf7f7;
    padding: 20px;
  }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-top: 4px solid var(--accent);
    border-radius: 12px;
    padding: 28px;
    width: 340px;
    max-width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  }
  h1 { font-family: var(--font-heading); font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: var(--unavailable); font-size: 13px; margin-top: 10px; display: none; }
  .success { color: var(--available); font-size: 13px; margin-top: 10px; display: none; }
  .footer-link { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; }
  .footer-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>Forgot password</h1>
  <p class="sub">Enter your account email and we'll send a reset link.</p>
  <form id="forgotForm">
    <label>Email</label>
    <input type="email" id="email" required autocomplete="username">
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    <button type="submit" id="submitBtn">Send reset link</button>
  </form>
  <div class="footer-link"><a href="/login">Back to log in</a></div>
</div>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const errorEl = document.getElementById('error');
  const successEl = document.getElementById('success');
  const submitBtn = document.getElementById('submitBtn');
  errorEl.style.display = 'none';
  successEl.style.display = 'none';

  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending...';
  try {
    const res = await fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      errorEl.textContent = body.error || ('Server error ' + res.status);
      errorEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send reset link';
      return;
    }
    successEl.textContent = body.message;
    successEl.style.display = 'block';
    submitBtn.textContent = 'Sent';
  } catch (err) {
    errorEl.textContent = 'Could not reach the server. Make sure server.py is running.';
    errorEl.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send reset link';
  }
});
</script>
</body>
</html>
